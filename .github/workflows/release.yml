name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: unraid-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pypi-publish:
    if: ${{ github.event.pull_request.draft != true }}
    name: Upload release to PyPI
    runs-on: ${{ (github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && github.event_name != 'pull_request_review' && (!github.event.pull_request.head.repo.full_name || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "Linux", "X64", "roadie", "unraid"]') || fromJSON('["ubuntu-24.04"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/opendbc
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution
        run: |
          ./test.sh
          source .venv/bin/activate
          uv pip install build
          python -m build

      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to Production PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@v1.12.4
